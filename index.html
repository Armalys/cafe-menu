<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Всплывающее окно выбора языка -->
<div id="language-overlay" class="overlay">
    <div class="modal">
        <h2 id="modal-title">Выберите язык / Izaberite jezik / Select Language / 选择语言</h2>
        <div class="lang-grid">
            <button onclick="setLanguage('ru')">🇷🇺 Русский</button>
            <button onclick="setLanguage('sr')">🇷🇸 Srpski</button>
            <button onclick="setLanguage('en')">🇬🇧 English</button>
            <button onclick="setLanguage('zh')">🇨🇳 中文</button>
        </div>
    </div>
</div>

<!-- Кнопки управления (Карта и Смена языка) -->
<header id="top-nav" class="hidden">
    <a href="https://maps.app.goo.gl/bqEkN3zcKyaWAwXHA" target="_blank" id="map-btn" class="nav-item"></a>
    <button onclick="showOverlay()" id="lang-btn" class="nav-item"></button>
</header>

<!-- Контейнер для картинки меню -->
<main id="menu-container" class="hidden">
    <img id="menu-img" src="" alt="Menu">
</main>

<script src="script.js"></script>
</body>
</html>
